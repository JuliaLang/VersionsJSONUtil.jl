name: Deploy JSON schema

on:
  workflow_dispatch:
  push:
    paths:
      - "schema.json"
      - ".github/workflows/deploy-schema.yml"
    branches:
      - "main"

concurrency:
  # Skip intermediate builds: all builds except for builds on the `master` branch
  # Cancel intermediate builds: only pull request builds
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref != 'refs/heads/main' || github.run_number }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read
  id-token: write # Needed to authenticate to AWS via GitHub's OIDC provider

env:
  aws_region: us-east-1
  s3_bucket: julialang2
  # Role ARNs aren't secret: the role can only be assumed from this repo's workflows
  # through GitHub's OIDC provider (see devdocs/README.md)
  aws_deploy_role_arn: arn:aws:iam::873569884612:role/VersionsJSONUtil-deploy

jobs:
  deploy-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # 6.2.3
        with:
          role-to-assume: ${{ env.aws_deploy_role_arn }}
          aws-region: ${{ env.aws_region }}

      - name: Upload schema.json as versions-schema.json to s3
        run: aws s3 cp schema.json s3://${{ env.s3_bucket }}/bin/versions-schema.json --acl public-read --no-progress

      - name: Purge cache
        run: curl -X PURGE https://julialang-s3.julialang.org/bin/versions-schema.json
